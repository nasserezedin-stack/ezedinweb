<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manchester United Store - Contact</title>
</head>
<body>

  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="../index.html">Home</a> |
      <a href="products.html">Products</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Send us an order or a question</h2>

    <form action="#" method="post">
      <p>
        <label for="name">Full name:</label>
        <input type="text" id="name" name="name" required>
      </p>

      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="item">Item:</label>
        <select id="item" name="item">
          <option value="home">Home shirt</option>
          <option value="away">Away shirt</option>
          <option value="scarf">Scarf</option>
          <option value="cap">Cap</option>
        </select>
      </p>

      <p>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40"></textarea>
      </p>

      <p>
        <button type="submit">Send</button>
      </p>
    </form>

    <h2>Other ways to reach us</h2>
    <p>
      You can also write to
      <a href="mailto:info@mustore.example">info@mustore.example</a>.
    </p>
  </main>

  <footer>
    <p>Email us: <a href="mailto:info@mustore.example">info@mustore.example</a></p>
    <p>Fan store project for Web Programming I</p>
  </footer>

</body>
</html>
